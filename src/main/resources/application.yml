spring:
  application:
    name: loanops
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: loanops
  flyway:
    enabled: true
    default-schema: loanops
    schemas: loanops
    locations: classpath:db/migration

loanops:
  sources:
    fss-finlife:
      base-url: ${FSS_API_BASE_URL:}
      path: ${FSS_API_PATH:}
      api-key: ${FSS_API_KEY:}
      top-fin-group-no: ${FSS_TOP_FIN_GROUP_NO:020000}
      page-no: ${FSS_PAGE_NO:1}
      connect-timeout: ${FSS_API_CONNECT_TIMEOUT:2s}
      read-timeout: ${FSS_API_READ_TIMEOUT:5s}
    seoul-loan-rate:
      base-url: ${SEOUL_API_BASE_URL:}
      service-name: ${SEOUL_API_SERVICE_NAME:}
      api-key: ${SEOUL_API_KEY:}
      page-size: ${SEOUL_API_PAGE_SIZE:5}
      connect-timeout: ${SEOUL_API_CONNECT_TIMEOUT:2s}
      read-timeout: ${SEOUL_API_READ_TIMEOUT:5s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
