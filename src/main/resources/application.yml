spring:
  application:
    name: loanops
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: loanops
  flyway:
    enabled: true
    default-schema: loanops
    schemas: loanops
    locations: classpath:db/migration

loanops:
  api:
    allowed-origins: ${LOANOPS_API_ALLOWED_ORIGINS:http://localhost:5173}
  sources:
    fss-finlife:
      base-url: ${FSS_API_BASE_URL:}
      path: ${FSS_API_PATH:}
      api-key: ${FSS_API_KEY:}
      top-fin-group-no: ${FSS_TOP_FIN_GROUP_NO:020000}
      page-no: ${FSS_PAGE_NO:1}
      connect-timeout: ${FSS_API_CONNECT_TIMEOUT:2s}
      read-timeout: ${FSS_API_READ_TIMEOUT:5s}
    seoul-loan-rate:
      base-url: ${SEOUL_API_BASE_URL:}
      service-name: ${SEOUL_API_SERVICE_NAME:}
      api-key: ${SEOUL_API_KEY:}
      page-size: ${SEOUL_API_PAGE_SIZE:5}
      connect-timeout: ${SEOUL_API_CONNECT_TIMEOUT:2s}
      read-timeout: ${SEOUL_API_READ_TIMEOUT:5s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

fincompass:
  open-banking:
    enabled: ${OPEN_BANKING_ENABLED:false}
    mode: ${OPEN_BANKING_MODE:DEMO_REPLAY}
    base-url: ${OPEN_BANKING_BASE_URL:}
    authorization-uri: ${OPEN_BANKING_AUTHORIZATION_URI:}
    token-uri: ${OPEN_BANKING_TOKEN_URI:}
    client-id: ${OPEN_BANKING_CLIENT_ID:}
    client-secret: ${OPEN_BANKING_CLIENT_SECRET:}
    redirect-uri: ${OPEN_BANKING_REDIRECT_URI:}
    bank-tran-prefix: ${OPEN_BANKING_BANK_TRAN_PREFIX:}
    encryption-key: ${OPEN_BANKING_ENCRYPTION_KEY:}
    encryption-key-id: ${OPEN_BANKING_ENCRYPTION_KEY_ID:local-v1}
    initial-lookback-days: ${OPEN_BANKING_INITIAL_LOOKBACK_DAYS:180}
    overlap-days: ${OPEN_BANKING_OVERLAP_DAYS:3}
    max-pages: ${OPEN_BANKING_MAX_PAGES:1000}
    connect-timeout: ${OPEN_BANKING_CONNECT_TIMEOUT:2s}
    read-timeout: ${OPEN_BANKING_READ_TIMEOUT:5s}
    max-response-bytes: ${OPEN_BANKING_MAX_RESPONSE_BYTES:1048576}

  personal:
    enabled: ${PERSONAL_FINANCE_ENABLED:false}
  data-quality:
    balance-stale-after: ${PERSONAL_BALANCE_STALE_AFTER:24h}
    policy-version: ${PERSONAL_DQ_POLICY_VERSION:personal-dq-v1}
